<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Cargar Productos | Fitness & Health Centers</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="catalogo.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Inter:wght@300;400;600;700;800;900&family=Montserrat:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar scrolled" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <img src="imagenes/logoFox.png" alt="Fox Gym" class="nav-logo">
                <span class="nav-divider"></span>
                <img src="imagenes/LogoCity.png" alt="City Fitness" class="nav-logo">
            </a>
            <button class="hamburger" id="hamburger" aria-label="Menú">
                <span></span><span></span><span></span>
            </button>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">INICIO</a></li>
                <li><a href="catalogo.html">CATÁLOGO</a></li>
                <li><a href="admin.html" class="nav-active">ADMIN</a></li>
            </ul>
        </div>
    </nav>

    <!-- Admin Hero -->
    <section class="admin-hero">
        <div class="container">
            <h1 class="admin-hero-title" data-anim="fade-up">PANEL DE ADMINISTRACIÓN</h1>
            <p class="admin-hero-sub" data-anim="fade-up" data-delay="200">Cargá y gestioná los productos del catálogo</p>
        </div>
    </section>

    <!-- Admin Content -->
    <section class="admin-section">
        <div class="container">
            <div class="admin-layout">
                <!-- Formulario -->
                <div class="admin-form-card" data-anim="fade-right">
                    <h3>NUEVO PRODUCTO</h3>
                    <form id="productForm">
                        <div class="form-group">
                            <label for="productName">Nombre del Producto</label>
                            <input type="text" id="productName" placeholder="Ej: Whey Protein 1kg" required>
                        </div>
                        <div class="form-group">
                            <label for="productCategory">Categoría</label>
                            <select id="productCategory" required>
                                <option value="">Seleccionar categoría...</option>
                                <option value="proteinas">Proteínas</option>
                                <option value="preentreno">Pre-Entrenos</option>
                                <option value="creatinas">Creatinas</option>
                                <option value="accesorios">Accesorios</option>
                                <option value="equipamiento">Equipamiento</option>
                                <option value="indumentaria">Indumentaria</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="productDesc">Descripción</label>
                            <textarea id="productDesc" placeholder="Breve descripción del producto..." required></textarea>
                        </div>
                        <div class="form-group">
                            <label>Imagen del Producto</label>
                            <div class="image-upload" id="imageUpload">
                                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.5">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                    <circle cx="8.5" cy="8.5" r="1.5"/>
                                    <polyline points="21 15 16 10 5 21"/>
                                </svg>
                                <p class="upload-text-main">Hacé clic o arrastrá una imagen</p>
                                <p>JPG, PNG, WEBP (máx 5MB)</p>
                            </div>
                            <input type="file" id="productImage" accept="image/*" hidden>
                            <div class="image-preview" id="imagePreview">
                                <img id="previewImg" src="" alt="Vista previa">
                            </div>
                        </div>
                        <button type="submit" class="submit-btn">AGREGAR PRODUCTO</button>
                    </form>
                </div>

                <!-- Lista de productos cargados -->
                <div class="admin-list-card" data-anim="fade-left">
                    <h3>PRODUCTOS CARGADOS</h3>
                    <div id="adminProductList">
                        <div class="empty-state">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.5">
                                <path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/>
                                <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
                                <line x1="12" y1="22.08" x2="12" y2="12"/>
                            </svg>
                            <p>No hay productos cargados todavía</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Toast -->
    <div class="toast" id="toast">Producto agregado correctamente ✓</div>

    <script src="script.js"></script>
    <script src="admin.js"></script>
</body>

</html>
